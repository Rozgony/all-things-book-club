    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is All Things Book Club?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All Things Book Club is a tool for book clubs, discussion groups, and social clubs. Each member adds a topic they find fascinating to a spinning wheel, the wheel picks one at random, and the group discusses it together."
          }
        },
        {
          "@type": "Question",
          "name": "Is it only for book clubs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. While it started with book clubs, All Things Book Club works for any discussion group or social club that wants to talk about pop culture, science, politics, books, or anything else members find interesting."
          }
        },
        {
          "@type": "Question",
          "name": "What kinds of topics can a discussion group cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Any topic a member wants to share, from a favorite book or reading recommendation to pop culture, scientific discoveries, or political news and current events."
          }
        },
        {
          "@type": "Question",
          "name": "How does All Things Book Club protect my group's privacy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Everything your book club, discussion group, or social club creates is end-to-end encrypted, meaning it is server-blind and cannot be read by All Things Book Club itself."
          }
        },
        {
          "@type": "Question",
          "name": "What encryption does All Things Book Club use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Content is encrypted on your device with AES-256-GCM using keys derived from your password via Argon2id before it is ever sent to the server, so only members of a chapter can decrypt it."
          }
        }
      ]
    }
